<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Freehold - documentation</title>
<meta name="description" content="Freehold documentation: the encrypting database, server-blind sync, data custody, and device trust - rendered in full, with search." />
<link rel="stylesheet" href="./site.css" />
</head>
<body>
<!-- header is injected by site-nav.js (one shared header across the whole site) -->

<div class="docs-shell">
  <!-- sidebar: search + grouped nav -->
  <aside class="docs-side">
    <div class="docs-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search the docs…" autocomplete="off" spellcheck="false" aria-label="Search the documentation" />
      <kbd>/</kbd>
      <div id="results" class="docs-results" hidden></div>
    </div>
    <nav id="docnav" class="docs-nav" aria-label="Documentation"></nav>
  </aside>

  <!-- rendered doc -->
  <main class="docs-main">
    <article id="doc" class="prose"></article>
    <div class="docs-foot">
      Something unclear or wrong? <a href="https://github.com/JSBtechnologies/freehold/tree/main/docs" target="_blank" rel="noopener">Edit these docs on GitHub ↗</a>
      · <a href="./index.html">Back to home</a>
    </div>
  </main>

  <!-- per-doc table of contents -->
  <aside class="docs-toc"><nav id="toc" aria-label="On this page"></nav></aside>
</div>

<script type="module" src="./site-nav.js" data-page="docs"></script>
<script type="module" src="./docs-app.js"></script>
</body>
</html>
